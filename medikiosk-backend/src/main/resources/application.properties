spring.application.name=medikiosk

server.port=8080

# --- Database (H2 in-memory for dev/demo) ---
# Swap block to MySQL before final submission - only this section changes.
spring.datasource.url=jdbc:h2:mem:medikiosk
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 web console for quickly inspecting demo data at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- CORS: set to your actual Vite dev server / deployed frontend origin ---
app.cors.allowed-origin=http://localhost:5173

# --- External API keys: fill these in your local .env / environment, never commit real values ---
# bhashini.api.key=${BHASHINI_API_KEY}
# bhashini.user.id=${BHASHINI_USER_ID}
# bhashini.inference.api.key=${BHASHINI_INFERENCE_API_KEY}
# google.vision.credentials.path=${GOOGLE_VISION_CREDENTIALS_PATH}
# groq.api.key=${GROQ_API_KEY}
# abdm.sandbox.client.id=${ABDM_CLIENT_ID}
# abdm.sandbox.client.secret=${ABDM_CLIENT_SECRET}

logging.level.com.aireX.medikiosk=DEBUG
